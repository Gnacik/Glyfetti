[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glyfetti"
version = "0.2.0a1"
description = "Styled game text & bitmap font atlas generator: gradient, outline, 3D side, bevel, gloss, shadow and glow baked into PNG atlases with BMFont/JSON metrics and a Unity TextMeshPro importer."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Wojciech Margowniczy" }]
keywords = ["bitmap font", "font atlas", "bmfont", "textmeshpro", "unity", "godot", "game ui", "text effects", "font generator", "game dev", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Games/Entertainment",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Text Processing :: Fonts",
  "Programming Language :: Python :: 3",
]
dependencies = ["pillow>=10", "numpy>=1.24", "scipy>=1.10", "fonttools>=4.40", "jsonschema>=4.18"]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3; python_version >= '3.11'"]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
glyfetti = "glyfetti.cli:main"

[project.urls]
Homepage = "https://github.com/Gnacik/glyfetti"
Documentation = "https://github.com/Gnacik/glyfetti/blob/main/docs/STYLE_REFERENCE.md"
Issues = "https://github.com/Gnacik/glyfetti/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/glyfetti"]

[tool.hatch.build.targets.wheel.force-include]
"fonts" = "glyfetti/data/fonts"
"presets" = "glyfetti/data/presets"
"schema" = "glyfetti/data/schema"

[tool.ruff]
target-version = "py310"
line-length = 160

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E401", "E702", "E741"]

[tool.mypy]
files = ["src/glyfetti"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["glyfetti"]
